name: E36 Test App Validation
on:
  push:
    branches: [feature/e36-test-app]
  pull_request:
    paths:
      - 'apps/e36_cluster_test/**'
      - 'shared/**'
      - 'tools/test_e36.js'
      - '.github/workflows/e36-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify generated E36 layouts are current
        run: |
          python3 tools/gen_e36.py apps/cluster_themes/hud/layouts/e36.json
          cmp apps/cluster_themes/hud/layouts/e36.json apps/e36_cluster_test/hud/layouts/e36.json
          git diff --exit-code -- apps/cluster_themes/hud/layouts/e36.json
      - name: E36 unit tests
        run: node tools/test_e36.js
      - name: Validate app manifest and assets
        run: |
          python3 - <<'PY'
          import json, os
          app = 'apps/e36_cluster_test'
          m = json.load(open(app + '/app.json'))
          assert m['id'] == 'e36_cluster_test'
          assert m['config']['target'] == 'panel'
          assert os.path.isfile(app + '/main.js')
          assert os.path.isfile(app + '/icon.png')
          layout = json.load(open(app + '/hud/layouts/e36.json'))
          for w in layout['widgets']:
              if 'font' in w:
                  assert os.path.isfile(app + '/hud/fonts/' + w['font'] + '.json'), w['font']
          print('E36 test app manifest and font assets valid')
          PY
      - name: Build standalone E36 app (requires proprietary SDK)
        if: ${{ hashFiles('oap-sdk/index.js', 'oap-sdk/package.json') != '' }}
        run: python3 kit/tools/build.py e36_cluster_test
